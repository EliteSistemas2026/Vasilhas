<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Iconic Tupperware Berry Rose -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="45%" stop-color="#BE185D" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Translucent Lid Glass / Silicone Gradient -->
    <linearGradient id="lidGrad" x1="100" y1="120" x2="412" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FCE7F3" stop-opacity="0.85" />
    </linearGradient>

    <!-- Fresh Mint Accent Gradient -->
    <linearGradient id="mintGrad" x1="180" y1="200" x2="330" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Glow Filter for Hermetic Seal Ring -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Ring -->
  <circle cx="256" cy="256" r="210" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />
  <circle cx="256" cy="256" r="185" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="6 6" />

  <!-- Tupperware Inspired Container Silhouette Group -->
  <g transform="translate(0, 8)">
    <!-- Container Body (Modern Curved Bowl / Canister) -->
    <path
      d="M 120 185
         L 142 350
         C 148 395 185 418 256 418
         C 327 418 364 395 370 350
         L 392 185
         Z"
      fill="#FFFFFF"
      fill-opacity="0.95"
      stroke="#FBCFE8"
      stroke-width="3"
    />

    <!-- Internal Fresh Food Organizers / Level Fill (Dual tone) -->
    <path
      d="M 148 340
         C 160 375 195 396 256 396
         C 317 396 352 375 364 340
         L 372 280
         C 320 292 192 292 140 280
         Z"
      fill="url(#mintGrad)"
      fill-opacity="0.9"
    />

    <!-- Frosted Body Highlights -->
    <path
      d="M 152 205 L 168 335"
      stroke="#FFFFFF"
      stroke-width="8"
      stroke-linecap="round"
      opacity="0.6"
    />
    <path
      d="M 174 215 L 184 315"
      stroke="#FFFFFF"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.4"
    />

    <!-- Signature Hermetic Seal Ring (Silicone Gasket) -->
    <rect
      x="100"
      y="166"
      width="312"
      height="22"
      rx="11"
      fill="#0F766E"
      opacity="0.9"
    />

    <!-- Signature Tupperware Easy-Open Tab & Radial Lid -->
    <rect
      x="88"
      y="136"
      width="336"
      height="34"
      rx="17"
      fill="url(#lidGrad)"
      stroke="#F43F5E"
      stroke-width="2"
      filter="url(#softGlow)"
    />

    <!-- Lid Top Sunburst / Concentric Groove (The unmistakable Tupperware seal trademark) -->
    <ellipse cx="256" cy="153" rx="100" ry="8" stroke="#E11D48" stroke-width="2.5" stroke-opacity="0.5" fill="none" />
    <ellipse cx="256" cy="153" rx="55" ry="4.5" stroke="#E11D48" stroke-width="2" stroke-opacity="0.6" fill="none" />

    <!-- Lid Pull Tab Indicator (Right Side) -->
    <path
      d="M 405 153 C 435 153 438 162 420 172 Z"
      fill="#F43F5E"
      opacity="0.9"
    />

    <!-- Central Emblem: Stylized Hermetic Freshness Star / Monogram -->
    <circle cx="256" cy="275" r="38" fill="#FFFFFF" opacity="0.96" filter="url(#softGlow)" />
    <!-- Modern Geometric Tulip / Leaf Monogram -->
    <path
      d="M 256 250
         C 244 262 242 276 247 288
         C 252 298 260 298 265 288
         C 270 276 268 262 256 250 Z"
      fill="#BE185D"
    />
    <path
      d="M 245 272
         C 235 272 232 284 242 291
         C 250 292 253 283 245 272 Z"
      fill="#0D9488"
    />
    <path
      d="M 267 272
         C 277 272 280 284 270 291
         C 262 292 259 283 267 272 Z"
      fill="#0D9488"
    />
  </g>
</svg>
